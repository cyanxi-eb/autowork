<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>项目工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/markdown.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>项目工作台</strong></div>
    <div class="project-nav">
      <select id="projects" aria-label="当前项目"><option value="">选择项目</option></select>
      <span class="stage" id="stage" hidden></span>
      <button id="project-memory" class="project-memory" type="button" hidden>项目记忆</button>
    </div>
    <div class="actions">
      <span class="mode"><i></i><span id="workspace-mode">本地工作台</span></span>
      <button id="theme-toggle" type="button" aria-pressed="false">暗色</button>
      <button id="new-project" type="button">新建项目</button>
      <button id="demo" class="primary" type="button">打开演示</button>
    </div>
  </header>

  <section id="demo-strip" class="demo-strip" aria-label="演示进度" hidden>
    <div class="demo-header">
      <div class="demo-heading"><strong>演示进度</strong><span id="demo-status" role="status"></span><span id="demo-round" class="round-label" hidden></span></div>
      <div class="demo-actions">
        <button id="artifacts" type="button" disabled>交付物</button>
        <button id="demo-control" type="button" hidden></button>
      </div>
    </div>
    <ol id="demo-steps" class="demo-steps" aria-label="闭环步骤"></ol>
  </section>

  <section id="live-strip" class="demo-strip" aria-label="项目进度" hidden>
    <div class="demo-header">
      <div class="demo-heading"><strong>项目进度</strong><span id="live-status" role="status"></span><span id="live-round" class="round-label"></span><span id="live-elapsed" class="round-label" hidden></span></div>
      <div class="demo-actions">
        <button id="live-artifacts" type="button" disabled>交付物</button>
        <button id="live-cancel" type="button" hidden>结束确认</button>
        <button id="live-retry-review" type="button" hidden>重试复核</button>
        <button id="run-project" class="primary" type="button">开始运行</button>
      </div>
    </div>
    <ol id="live-steps" class="demo-steps" aria-label="项目步骤"></ol>
    <p id="live-detail" class="live-detail"></p>
  </section>

  <nav class="layout-bar" aria-label="工作台布局">
    <button id="toggle-left" type="button" aria-controls="left-panel" aria-expanded="true"><span aria-hidden="true">◧</span> 左侧面板</button>
    <span id="notice" role="status"></span>
    <button id="toggle-right" type="button" aria-controls="right-panel" aria-expanded="true">右侧面板 <span aria-hidden="true">◨</span></button>
  </nav>

  <main id="workspace" class="workspace">
    <aside id="left-panel" class="panel dock" data-side="left" aria-label="左侧 Agent 面板"></aside>
    <section class="panel center" aria-labelledby="conversation-title">
      <header class="panel-heading center-heading">
        <span class="agent-icon deepseek" aria-hidden="true">DS</span>
        <div><h1 id="conversation-title">DeepSeek</h1><p>项目协调</p></div>
        <div class="panel-controls">
          <button id="deepseek-persona" class="panel-button" type="button" aria-label="DeepSeek 人设">人设</button>
          <button id="deepseek-connection" class="panel-button" type="button" aria-label="DeepSeek 接口">API 接口</button>
        </div>
      </header>
      <div id="conversation" class="messages central-messages" role="log" aria-label="项目对话"></div>
      <div id="demo-choices" class="demo-choices" hidden></div>
      <form id="composer" class="composer" hidden>
        <label for="message" class="sr-only">补充需求</label>
        <textarea id="message" rows="2" maxlength="8000" required placeholder="补充需求、约束或验收条件…"></textarea>
        <button class="primary" type="submit">发送 <span aria-hidden="true">↑</span></button>
      </form>
    </section>
    <aside id="right-panel" class="panel dock" data-side="right" aria-label="右侧 Agent 面板"></aside>
  </main>

  <template id="dock-template">
    <header class="panel-heading dock-heading">
      <span class="agent-icon" aria-hidden="true"></span>
      <div><select class="agent-select" aria-label="选择 Agent"></select><p class="agent-role"></p></div>
      <div class="panel-controls">
        <button class="panel-button dock-persona" type="button">人设</button>
        <button class="panel-button dock-connection" type="button">接口</button>
      </div>
    </header>
    <div class="session-bar"><select class="session-select" aria-label="选择会话"></select><span class="candidate"></span></div>
    <div class="messages dock-messages" role="region" aria-label="Agent 历史会话" tabindex="0"></div>
  </template>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <h2 id="create-title">新建项目</h2>
      <label for="project-name">项目名称</label>
      <input id="project-name" maxlength="80" required autofocus>
      <label for="project-request">初始需求</label>
      <textarea id="project-request" rows="5" maxlength="8000" required></textarea>
      <p id="create-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="cancel-create" type="button">取消</button><button class="primary" type="submit">创建项目</button></div>
    </form>
  </dialog>

  <dialog id="connection-dialog" aria-labelledby="connection-title">
    <form id="connection-form">
      <h2 id="connection-title">Agent 接口</h2>
      <p id="connection-status" class="connection-status"></p>
      <div id="connection-fields" class="connection-fields"></div>
      <p id="connection-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="close-connection" type="button">关闭</button><button id="save-connection" class="primary" type="submit" disabled>保存配置</button></div>
    </form>
  </dialog>

  <dialog id="run-dialog" aria-labelledby="run-title">
    <form id="run-form">
      <h2 id="run-title">开始项目运行</h2>
      <label for="run-source">本地 Git 仓库</label>
      <input id="run-source" maxlength="1024" required autofocus>
      <p id="run-source-hint" class="connection-status">以仓库当前 Git 提交创建独立候选副本。执行和返修在副本中进行。</p>
      <label for="run-acceptance">验收条件</label>
      <textarea id="run-acceptance" rows="4" maxlength="8000" required placeholder="写下预期结果，以及复核 Agent 可以执行的测试或检查。"></textarea>
      <label id="run-local-label" class="checkbox-row"><input id="run-local" type="checkbox">按我的验收条件直接开始，跳过 DeepSeek API 追问</label>
      <p id="run-connections" class="connection-status" role="status"></p>
      <p id="run-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="cancel-run" type="button">取消</button><button class="primary" type="submit">开始运行</button></div>
    </form>
  </dialog>

  <dialog id="artifact-dialog" class="artifacts-dialog" aria-labelledby="artifact-title">
    <header><h2 id="artifact-title">交付物</h2><button id="close-artifacts" type="button">关闭</button></header>
    <div class="artifact-layout">
      <nav id="artifact-list" aria-label="交付物列表"></nav>
      <section class="artifact-preview" aria-labelledby="artifact-name">
        <h3 id="artifact-name" class="sr-only"></h3>
        <p id="artifact-path"></p>
        <div id="artifact-content"></div>
      </section>
    </div>
  </dialog>

  <dialog id="context-dialog" class="artifacts-dialog" aria-labelledby="context-title">
    <header><h2 id="context-title"></h2><button id="close-context" type="button">关闭</button></header>
    <section class="artifact-preview" aria-label="Markdown 内容">
      <p id="context-path"></p>
      <div id="context-content" tabindex="0"></div>
    </section>
  </dialog>
</body>
</html>
